openapi: 3.0.3
info:
  title: API de Riesgo de Lesiones Deportivas
  version: 1.1.0
  description: |
    Servicio REST para gestión de deportistas, sesiones de entrenamiento y lesiones,
    con integración de datos externos meteorológicos en JSON (Open-Meteo) y XML
    (Meteoalarm CAP feed). Si una fuente externa cae, la API sigue respondiendo
    con snapshots cacheados.

    ## Relaciones entre recursos

    ```
    Athlete  1 ─── N  TrainingSession
       │
       └── 1 ─── N  Injury
                      │
                      └── 0..1  TrainingSession
    ```

    - Un **Athlete** tiene N **TrainingSession** (campo `athleteId` en la sesión).
    - Un **Athlete** tiene N **Injury** (campo `athleteId` en la lesión).
    - Una **Injury** puede asociarse opcionalmente a una **TrainingSession**
      (campo `sessionId`, nullable) si la lesión ocurrió durante esa sesión.

    Las relaciones se pueden navegar de dos formas:

    1. **Por filtro** sobre la colección plana:
       `GET /sessions?athleteId=...`, `GET /injuries?athleteId=...`,
       `GET /injuries?sessionId=...`.
    2. **Por rutas anidadas** (más expresivas y recomendadas para integraciones):
       `GET /athletes/{athleteId}/sessions`,
       `GET /athletes/{athleteId}/injuries`,
       `GET /sessions/{sessionId}/injuries`.
       También se puede crear directamente desde la jerarquía:
       `POST /athletes/{athleteId}/sessions` y
       `POST /athletes/{athleteId}/injuries` toman el `athleteId` de la URL,
       por lo que no es necesario incluirlo en el body.

    ## Formatos soportados

    - JSON: todas las rutas.
    - XML: `POST /athletes`, `GET /athletes/{id}`, `POST /injuries`,
      `POST /athletes/{athleteId}/injuries`.
      Schemas XML asociados:
      [documentacion/athlete.xsd](athlete.xsd),
      [documentacion/injury.xsd](injury.xsd).

    ## Identificadores
    Todos los `_id` son ObjectId de MongoDB (24 caracteres hexadecimales).

servers:
  - url: http://localhost:3000/api/v1
    description: Local

tags:
  - name: Health
  - name: Athletes
  - name: Sessions
  - name: Injuries
  - name: External

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true

  /athletes:
    get:
      tags: [Athletes]
      summary: Listar deportistas
      responses:
        '200':
          description: Lista de deportistas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Athlete'
              example:
                - _id: "661a0f2c2ef4aa0012c7a911"
                  fullName: "Laura Martínez"
                  birthDate: "1998-09-04"
                  sex: "female"
                  heightCm: 168
                  weightKg: 58.4
                  primarySport: "running"
                  team: "Club Norte"
    post:
      tags: [Athletes]
      summary: Crear deportista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteCreate'
            example:
              fullName: "Laura Martínez"
              birthDate: "1998-09-04"
              sex: "female"
              heightCm: 168
              weightKg: 58.4
              primarySport: "running"
              team: "Club Norte"
          application/xml:
            schema:
              $ref: '#/components/schemas/AthleteCreate'
            example: |
              <Athlete>
                <fullName>Laura Martínez</fullName>
                <birthDate>1998-09-04</birthDate>
                <sex>female</sex>
                <heightCm>168</heightCm>
                <weightKg>58.4</weightKg>
                <primarySport>running</primarySport>
                <team>Club Norte</team>
              </Athlete>
      responses:
        '201':
          description: Deportista creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'

  /athletes/{athleteId}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Athletes]
      summary: Obtener deportista por id
      responses:
        '200':
          description: Deportista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
            application/xml:
              schema:
                $ref: '#/components/schemas/Athlete'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Athletes]
      summary: Actualizar deportista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteCreate'
      responses:
        '200':
          description: Deportista actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Athletes]
      summary: Eliminar deportista
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athleteId}/sessions:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Athletes, Sessions]
      summary: Listar sesiones de un atleta
      description: |
        Atajo equivalente a `GET /sessions?athleteId={athleteId}`.
        Hereda los mismos parámetros de paginación y filtros (excepto `athleteId`,
        que ya está fijado por la URL).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RiskLevel'
        - $ref: '#/components/parameters/WeatherAlertLevel'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Sesiones del atleta paginadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessions'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Athletes, Sessions]
      summary: Crear sesión asignada a un atleta
      description: |
        Equivalente a `POST /sessions`, pero el `athleteId` se toma de la URL
        en lugar del body. Hace explícita la relación Athlete → Session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateNested'
            example:
              sport: "running"
              sessionDate: "2026-03-24T18:30:00Z"
              durationMinutes: 75
              load: 82
              surface: "asphalt"
              location:
                name: "Parque del Retiro"
                lat: 40.4153
                lon: -3.6844
                countryCode: "ES"
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athleteId}/injuries:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Athletes, Injuries]
      summary: Listar lesiones de un atleta
      description: Atajo equivalente a `GET /injuries?athleteId={athleteId}`.
      responses:
        '200':
          description: Lesiones del atleta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Athletes, Injuries]
      summary: Crear lesión asignada a un atleta
      description: |
        Equivalente a `POST /injuries`, pero el `athleteId` se toma de la URL.
        `sessionId` sigue siendo opcional en el body si la lesión está asociada a
        una sesión concreta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryCreateNested'
            example:
              sessionId: "662b1f3d3fe5bb1113d8b022"
              injuryDate: "2026-03-24T19:45:00Z"
              injuryType: "muscular"
              bodyPart: "hamstring"
              severity: "moderate"
              daysOut: 7
              notes: "Notada en últimas 2 series"
          application/xml:
            schema:
              $ref: '#/components/schemas/InjuryCreateNested'
            example: |
              <Injury>
                <sessionId>662b1f3d3fe5bb1113d8b022</sessionId>
                <injuryDate>2026-03-24T19:45:00Z</injuryDate>
                <injuryType>muscular</injuryType>
                <bodyPart>hamstring</bodyPart>
                <severity>moderate</severity>
                <daysOut>7</daysOut>
                <notes>Notada en últimas 2 series</notes>
              </Injury>
      responses:
        '201':
          description: Lesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions:
    get:
      tags: [Sessions]
      summary: Listar sesiones con paginación y filtros
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: athleteId
          in: query
          description: Filtra por _id del atleta propietario.
          schema:
            $ref: '#/components/schemas/ObjectIdHex'
        - $ref: '#/components/parameters/RiskLevel'
        - $ref: '#/components/parameters/WeatherAlertLevel'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Resultado paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessions'
              example:
                page: 1
                limit: 2
                total: 134
                totalPages: 67
                data:
                  - _id: "662b1f3d3fe5bb1113d8b022"
                    athleteId: "661a0f2c2ef4aa0012c7a911"
                    sport: "running"
                    sessionDate: "2026-03-24T18:30:00Z"
                    durationMinutes: 75
                    load: 82
                    surface: "asphalt"
                    location:
                      name: "Parque del Retiro"
                      lat: 40.4153
                      lon: -3.6844
                      countryCode: "ES"
                    weatherSnapshotId: "664d31555fb7dd3335f0d244"
                    weatherAlertLevel: "moderate"
                    riskLevel: "high"
                    externalDataStatus: "ok"
                  - _id: "662b1f3d3fe5bb1113d8b023"
                    athleteId: "661a0f2c2ef4aa0012c7a911"
                    sport: "running"
                    sessionDate: "2026-03-22T17:00:00Z"
                    durationMinutes: 60
                    load: 55
                    surface: "track"
                    location:
                      name: "Pista Vallehermoso"
                      lat: 40.4416
                      lon: -3.7036
                      countryCode: "ES"
                    weatherAlertLevel: "none"
                    riskLevel: "medium"
                    externalDataStatus: "cached"
    post:
      tags: [Sessions]
      summary: Crear sesión de entrenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              athleteId: "661a0f2c2ef4aa0012c7a911"
              sport: "running"
              sessionDate: "2026-03-24T18:30:00Z"
              durationMinutes: 75
              load: 82
              surface: "asphalt"
              location:
                name: "Parque del Retiro"
                lat: 40.4153
                lon: -3.6844
                countryCode: "ES"
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      summary: Obtener sesión por id
      responses:
        '200':
          description: Sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Sessions]
      summary: Actualizar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '200':
          description: Sesión actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sessions]
      summary: Eliminar sesión
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{sessionId}/injuries:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions, Injuries]
      summary: Listar lesiones asociadas a una sesión
      description: Atajo equivalente a `GET /injuries?sessionId={sessionId}`.
      responses:
        '200':
          description: Lesiones de la sesión
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
        '404':
          $ref: '#/components/responses/NotFound'

  /injuries:
    get:
      tags: [Injuries]
      summary: Listar lesiones
      parameters:
        - name: athleteId
          in: query
          description: Filtra por _id del atleta.
          schema:
            $ref: '#/components/schemas/ObjectIdHex'
        - name: sessionId
          in: query
          description: Filtra por _id de la sesión.
          schema:
            $ref: '#/components/schemas/ObjectIdHex'
      responses:
        '200':
          description: Lista de lesiones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
              example:
                - _id: "663c20444fa6cc2224e9c133"
                  athleteId: "661a0f2c2ef4aa0012c7a911"
                  sessionId: "662b1f3d3fe5bb1113d8b022"
                  injuryDate: "2026-03-24T19:45:00Z"
                  injuryType: "muscular"
                  bodyPart: "hamstring"
                  severity: "moderate"
                  daysOut: 7
                  notes: "Notada en últimas 2 series"
    post:
      tags: [Injuries]
      summary: Crear lesión
      description: |
        Crea una lesión proporcionando `athleteId` en el body.
        Si se prefiere expresar la relación por URL, usar
        `POST /athletes/{athleteId}/injuries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryCreate'
            example:
              athleteId: "661a0f2c2ef4aa0012c7a911"
              sessionId: "662b1f3d3fe5bb1113d8b022"
              injuryDate: "2026-03-24T19:45:00Z"
              injuryType: "muscular"
              bodyPart: "hamstring"
              severity: "moderate"
              daysOut: 7
              notes: "Notada en últimas 2 series"
          application/xml:
            schema:
              $ref: '#/components/schemas/InjuryCreate'
            example: |
              <Injury>
                <athleteId>661a0f2c2ef4aa0012c7a911</athleteId>
                <sessionId>662b1f3d3fe5bb1113d8b022</sessionId>
                <injuryDate>2026-03-24T19:45:00Z</injuryDate>
                <injuryType>muscular</injuryType>
                <bodyPart>hamstring</bodyPart>
                <severity>moderate</severity>
                <daysOut>7</daysOut>
                <notes>Notada en últimas 2 series</notes>
              </Injury>
      responses:
        '201':
          description: Lesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'

  /injuries/{injuryId}:
    parameters:
      - $ref: '#/components/parameters/InjuryId'
    get:
      tags: [Injuries]
      summary: Obtener lesión por id
      responses:
        '200':
          description: Lesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Injuries]
      summary: Actualizar lesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryCreate'
      responses:
        '200':
          description: Lesión actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Injuries]
      summary: Eliminar lesión
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  /external/weather/refresh:
    post:
      tags: [External]
      summary: Refrescar snapshot meteorológico desde API JSON (Open-Meteo)
      responses:
        '200':
          description: Snapshot actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalRefreshResult'
              example:
                source: "open-meteo"
                status: "ok"
                processedRecords: 1
                syncedAt: "2026-05-17T15:00:00Z"
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /external/alerts/refresh:
    post:
      tags: [External]
      summary: Refrescar alertas desde feed XML (Meteoalarm CAP)
      responses:
        '200':
          description: Alertas actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalRefreshResult'
              example:
                source: "meteoalarm"
                status: "ok"
                processedRecords: 1
                syncedAt: "2026-05-17T15:00:00Z"
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /external/status:
    get:
      tags: [External]
      summary: Estado de integraciones externas
      responses:
        '200':
          description: Estado de fuentes externas
          content:
            application/json:
              schema:
                type: object
                properties:
                  weatherJson:
                    type: string
                    enum: [ok, degraded, unavailable]
                  alertsXml:
                    type: string
                    enum: [ok, degraded, unavailable]
                  lastSyncAt:
                    type: string
                    format: date-time
              example:
                weatherJson: "ok"
                alertsXml: "degraded"
                lastSyncAt: "2026-05-17T15:00:00Z"

components:
  parameters:
    AthleteId:
      name: athleteId
      in: path
      required: true
      description: ObjectId del atleta.
      schema:
        $ref: '#/components/schemas/ObjectIdHex'
    SessionId:
      name: sessionId
      in: path
      required: true
      description: ObjectId de la sesión de entrenamiento.
      schema:
        $ref: '#/components/schemas/ObjectIdHex'
    InjuryId:
      name: injuryId
      in: path
      required: true
      description: ObjectId de la lesión.
      schema:
        $ref: '#/components/schemas/ObjectIdHex'
    Page:
      name: page
      in: query
      description: Página (1-indexada).
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Tamaño de página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RiskLevel:
      name: riskLevel
      in: query
      description: Filtra por nivel de riesgo calculado.
      schema:
        type: string
        enum: [low, medium, high]
    WeatherAlertLevel:
      name: weatherAlertLevel
      in: query
      description: Filtra por nivel de alerta meteorológica.
      schema:
        type: string
        enum: [none, low, moderate, high, extreme]
    From:
      name: from
      in: query
      description: Fecha mínima de sesión (ISO 8601).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Fecha máxima de sesión (ISO 8601).
      schema:
        type: string
        format: date-time

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "NOT_FOUND"
            message: "Athlete not found"
    ServiceUnavailable:
      description: Servicio externo no disponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "EXTERNAL_UNAVAILABLE"
            message: "Weather source unavailable"

  schemas:
    ObjectIdHex:
      type: string
      description: ObjectId de MongoDB (24 caracteres hexadecimales).
      pattern: '^[0-9a-fA-F]{24}$'
      example: "661a0f2c2ef4aa0012c7a911"

    Athlete:
      type: object
      xml:
        name: Athlete
      properties:
        _id:
          $ref: '#/components/schemas/ObjectIdHex'
        fullName:
          type: string
          example: "Laura Martínez"
        birthDate:
          type: string
          format: date
          example: "1998-09-04"
        sex:
          type: string
          enum: [male, female, other]
          example: "female"
        heightCm:
          type: number
          example: 168
        weightKg:
          type: number
          example: 58.4
        primarySport:
          type: string
          example: "running"
        team:
          type: string
          example: "Club Norte"
      required: [_id, fullName, birthDate, sex, primarySport]

    AthleteCreate:
      type: object
      xml:
        name: Athlete
      description: |
        Cuerpo para crear o actualizar un Athlete. El schema XML asociado está en
        [documentacion/athlete.xsd](athlete.xsd).
      properties:
        fullName:
          type: string
        birthDate:
          type: string
          format: date
        sex:
          type: string
          enum: [male, female, other]
        heightCm:
          type: number
        weightKg:
          type: number
        primarySport:
          type: string
        team:
          type: string
      required: [fullName, birthDate, sex, primarySport]

    SessionLocation:
      type: object
      properties:
        name:
          type: string
          example: "Parque del Retiro"
        lat:
          type: number
          example: 40.4153
        lon:
          type: number
          example: -3.6844
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2.
          example: "ES"
      required: [lat, lon, countryCode]

    Session:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectIdHex'
        athleteId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          description: >-
            Referencia al `_id` del Athlete propietario de la sesión.
            Relación N:1 (muchas sesiones por atleta).
        sport:
          type: string
          example: "running"
        sessionDate:
          type: string
          format: date-time
          example: "2026-03-24T18:30:00Z"
        durationMinutes:
          type: integer
          example: 75
        load:
          type: integer
          minimum: 0
          maximum: 100
          example: 82
        surface:
          type: string
          example: "asphalt"
        location:
          $ref: '#/components/schemas/SessionLocation'
        weatherSnapshotId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          description: >-
            Referencia al `_id` del WeatherSnapshot externo asociado (colección
            interna `external_weather_snapshots`). Puede no estar si la fuente
            externa estaba caída en el momento de la creación.
        weatherAlertLevel:
          type: string
          enum: [none, low, moderate, high, extreme]
          example: "moderate"
        riskLevel:
          type: string
          enum: [low, medium, high]
          example: "high"
        externalDataStatus:
          type: string
          enum: [ok, cached, unavailable]
          example: "ok"
      required: [_id, athleteId, sport, sessionDate, durationMinutes]

    SessionCreate:
      type: object
      description: Cuerpo para crear o actualizar una sesión (incluye `athleteId`).
      properties:
        athleteId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          description: Referencia al `_id` del Athlete propietario de la sesión.
        sport:
          type: string
        sessionDate:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        load:
          type: integer
          minimum: 0
          maximum: 100
        surface:
          type: string
        location:
          $ref: '#/components/schemas/SessionLocation'
      required: [athleteId, sport, sessionDate, durationMinutes, location]

    SessionCreateNested:
      type: object
      description: >-
        Variante de `SessionCreate` usada en `POST /athletes/{athleteId}/sessions`,
        donde `athleteId` se toma de la URL y por tanto no aparece en el body.
      properties:
        sport:
          type: string
        sessionDate:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        load:
          type: integer
          minimum: 0
          maximum: 100
        surface:
          type: string
        location:
          $ref: '#/components/schemas/SessionLocation'
      required: [sport, sessionDate, durationMinutes, location]

    PaginatedSessions:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
      required: [page, limit, total, totalPages, data]

    Injury:
      type: object
      xml:
        name: Injury
      properties:
        _id:
          $ref: '#/components/schemas/ObjectIdHex'
        athleteId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          description: Referencia al `_id` del Athlete lesionado. Relación N:1.
        sessionId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          nullable: true
          description: >-
            Referencia opcional al `_id` de la TrainingSession en la que se produjo
            la lesión. Puede ser null si no se conoce la sesión exacta.
        injuryDate:
          type: string
          format: date-time
          example: "2026-03-24T19:45:00Z"
        injuryType:
          type: string
          example: "muscular"
        bodyPart:
          type: string
          example: "hamstring"
        severity:
          type: string
          enum: [mild, moderate, severe]
          example: "moderate"
        daysOut:
          type: integer
          example: 7
        notes:
          type: string
          example: "Notada en últimas 2 series"
      required: [_id, athleteId, injuryDate, injuryType, bodyPart, severity]

    InjuryCreate:
      type: object
      xml:
        name: Injury
      description: |
        Cuerpo para crear o actualizar una lesión. Schema XML asociado en
        [documentacion/injury.xsd](injury.xsd).
      properties:
        athleteId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          description: Referencia al `_id` del Athlete.
        sessionId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          nullable: true
          description: Referencia opcional al `_id` de la TrainingSession.
        injuryDate:
          type: string
          format: date-time
        injuryType:
          type: string
        bodyPart:
          type: string
        severity:
          type: string
          enum: [mild, moderate, severe]
        daysOut:
          type: integer
        notes:
          type: string
      required: [athleteId, injuryDate, injuryType, bodyPart, severity]

    InjuryCreateNested:
      type: object
      xml:
        name: Injury
      description: >-
        Variante de `InjuryCreate` usada en `POST /athletes/{athleteId}/injuries`,
        donde `athleteId` se toma de la URL y por tanto no aparece en el body.
      properties:
        sessionId:
          allOf:
            - $ref: '#/components/schemas/ObjectIdHex'
          nullable: true
        injuryDate:
          type: string
          format: date-time
        injuryType:
          type: string
        bodyPart:
          type: string
        severity:
          type: string
          enum: [mild, moderate, severe]
        daysOut:
          type: integer
        notes:
          type: string
      required: [injuryDate, injuryType, bodyPart, severity]

    ExternalRefreshResult:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ok, cached, unavailable]
        processedRecords:
          type: integer
        syncedAt:
          type: string
          format: date-time
      required: [source, status, processedRecords, syncedAt]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Athlete not found"
        details:
          type: object
          additionalProperties: true
      required: [code, message]
